name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: build & test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            xkcp_target: x86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            xkcp_target: generic64
    env:
      # Honoured by build.rs and the interop cref Makefile.
      XKCP_TARGET: ${{ matrix.xkcp_target }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tooling
        run: sudo apt-get update && sudo apt-get install -y xsltproc bats

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (also builds libXKCP from the submodule)
        run: cargo build --release

      - name: Conformance tests
        run: SUW_BIN="$(pwd)/target/release/shakeupwrap-rs" bats tests

      - name: Cross-implementation interop (Rust <-> C reference)
        run: ./tests/interop/run_interop.sh
